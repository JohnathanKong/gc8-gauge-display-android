services:
  android:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - gradle-cache:/home/android/.gradle
      - android-debug-signing:/home/android/.android
    stdin_open: true
    tty: true
    environment:
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_HOME: /opt/android-sdk

volumes:
  gradle-cache:
  android-debug-signing:
